<section class="acceso rayos">
  <div class="acceso__tarjeta">
    <img src="/marca/isotipo-96.png" alt="" width="64" height="64" class="acceso__logo" />
    <h1>Ingresar</h1>
    <p class="texto-suave">Accedé a tus entradas, puntos y alertas de estrenos.</p>

    <form [formGroup]="formulario" (ngSubmit)="ingresar()" novalidate>
      <div
        class="campo"
        [class.campo--invalido]="
          formulario.controls.email.invalid && formulario.controls.email.touched
        "
      >
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
        <app-errores-campo [control]="formulario.controls.email" />
      </div>

      <div
        class="campo"
        [class.campo--invalido]="
          formulario.controls.password.invalid && formulario.controls.password.touched
        "
      >
        <label for="password">Contraseña</label>
        <div class="con-boton">
          <input
            id="password"
            [type]="verPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="mostrar"
            (click)="verPassword.set(!verPassword())"
            [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ verPassword() ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        <app-errores-campo [control]="formulario.controls.password" />
      </div>

      @if (error()) {
        <p class="aviso aviso--error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn btn--primario btn--bloque" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <p class="acceso__pie">
      ¿No tenés cuenta? <a routerLink="/registro">Registrate</a> y tu primera compra tiene
      descuento.
    </p>
    <p class="acceso__pie texto-suave">
      También podés <a routerLink="/cartelera">comprar sin cuenta</a>.
    </p>
  </div>
</section>
